[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robot_arm"]

[project.scripts]
arm-controller = "robot_arm.apps.controller:main"
arm-camera-view = "robot_arm.apps.camera_view:main"

[project]
name = "robot-arm-6dof"
version = "2.0.0"
description = "Camera detection and control software for a 6-DOF robotic arm"
requires-python = ">=3.11,<3.14"

dependencies = [
    "coppeliasim-zmqremoteapi-client>=2.0.4",
    "groundingdino",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pyside6>=6.11.2",
    "pyyaml>=6.0.3",
    "setuptools>=84.0.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers==4.37.2",
    "ultralytics>=8.4.126",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv.sources]
groundingdino = { git = "https://github.com/IDEA-Research/GroundingDINO.git" }

[tool.uv.extra-build-dependencies]
groundingdino = ["torch"]